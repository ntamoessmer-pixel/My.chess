<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanChess - Play & Connect</title>
  
  <!-- CSS Frameworks & Chessboard CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header / Navbar */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .streak-badge {
      background: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
      border: 1px solid #f59e0b;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Auth Screen (Modal / View) */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .auth-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: white;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      margin-top: 0.5rem;
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    /* Main App Layout */
    main {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 2rem;
      padding: 2rem;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Board Area */
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #myBoard {
      width: 100%;
      max-width: 550px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .game-controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    /* Sidebar / Community */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .sidebar h3 {
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .user-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
    }

    .user-item .btn-sm {
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
      width: auto;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">♟️ CleanChess</div>
    <div class="user-info hidden" id="user-info">
      <span class="streak-badge" id="streak-display">🔥 0 Tage Streak</span>
      <span id="player-name-display" style="font-weight: 600;"></span>
      <button onclick="logout()" class="btn btn-secondary" style="width: auto; padding: 0.4rem 0.8rem;">Logout</button>
    </div>
  </header>

  <!-- Login/Register Overlay -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>Willkommen bei CleanChess</h2>
      <form id="auth-form">
        <div class="form-group">
          <label for="username">Benutzername</label>
          <input type="text" id="username" required placeholder="z.B. GrandmasterX">
        </div>
        <div class="form-group">
          <label for="email">E-Mail-Adresse</label>
          <input type="email" id="email" required placeholder="deine@email.de">
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Konto erstellen & Spielen</button>
      </form>
    </div>
  </div>

  <!-- Main Game & Community Area -->
  <main>
    <!-- Left: Chess Board -->
    <div class="game-container">
      <div id="myBoard"></div>
      <div class="game-controls">
        <button class="btn" onclick="startBotGame()">🤖 Gegen KI spielen</button>
        <button class="btn btn-secondary" onclick="resetBoard()">🔄 Neu starten</button>
      </div>
    </div>

    <!-- Right: Friends & Global List -->
    <div class="sidebar">
      <div>
        <h3>🌍 Globale Spieler & Freunde</h3>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; margin-bottom: 12px;">
          Lade Spieler zu einem Match ein.
        </p>
        <ul class="user-list" id="global-user-list">
          <!-- Dynamische Liste -->
        </ul>
      </div>

      <div>
        <h3>📊 Spiel-Status</h3>
        <p id="status" style="margin-top: 10px; color: var(--text-muted); font-size: 0.9rem;">Melde dich an, um zu spielen.</p>
      </div>
    </div>
  </main>

  <!-- Scripts: jQuery, Chess.js, Chessboard.js -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script>
    // System-Status Variablen
    let board = null;
    let game = new Chess();
    let currentUser = null;
    let vsBot = false;

    // Dummy Globale Liste für Community-Gefühl
    const mockGlobalUsers = [
      { name: "Magnus_Fan", streak: 5 },
      { name: "ChessMaster99", streak: 12 },
      { name: "QueenGambit", streak: 3 },
      { name: "NoobGamer", streak: 0 }
    ];

    // Login Form Submit Event
    document.getElementById('auth-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;

      // User LocalStorage Persistence
      currentUser = {
        name: username,
        email: email,
        streak: 1 // Start-Streak beim Login
      };

      localStorage.setItem('cleanChess_user', JSON.stringify(currentUser));
      initApp();
    });

    function logout() {
      localStorage.removeItem('cleanChess_user');
      location.reload();
    }

    function checkAuth() {
      const stored = localStorage.getItem('cleanChess_user');
      if (stored) {
        currentUser = JSON.parse(stored);
        initApp();
      }
    }

    function initApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('user-info').classList.remove('hidden');
      document.getElementById('player-name-display').innerText = currentUser.name;
      document.getElementById('streak-display').innerText = `🔥 ${currentUser.streak} Tag(e) Streak`;

      initBoard();
      renderGlobalList();
    }

    // Schach-Brett Logik
    function initBoard() {
      const config = {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };
      board = Chessboard('myBoard', config);
      updateStatus();
    }

    function onDragStart (source, piece, position, orientation) {
      if (game.game_over()) return false;
      if (piece.search(/^b/) !== -1 && vsBot) return false; // Nur Weiß ziehen lassen wenn gegen KI
    }

    function makeRandomMove () {
      const possibleMoves = game.moves();
      if (possibleMoves.length === 0) return;

      const randomIdx = Math.floor(Math.random() * possibleMoves.length);
      game.move(possibleMoves[randomIdx]);
      board.position(game.fen());
      updateStatus();
    }

    function onDrop (source, target) {
      // Zug versuchen
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      updateStatus();

      // Wenn KI Aktiv ist, Antwortzug berechnen
      if (vsBot && !game.game_over()) {
        window.setTimeout(makeRandomMove, 250);
      }
    }

    function onSnapEnd () {
      board.position(game.fen());
    }

    function updateStatus () {
      let statusText = '';

      if (game.in_checkmate()) {
        statusText = 'Schachmatt! Das Spiel ist vorbei.';
      } else if (game.in_draw()) {
        statusText = 'Patt / Unentschieden!';
      } else {
        statusText = (game.turn() === 'w') ? 'Weiß am Zug' : 'Schwarz am Zug';
        if (game.in_check()) {
          statusText += ', Schach!';
        }
      }

      document.getElementById('status').innerText = statusText;
    }

    function startBotGame() {
      resetBoard();
      vsBot = true;
      document.getElementById('status').innerText = "Spiel gegen KI gestartet! Du spielst Weiß.";
    }

    function resetBoard() {
      game.reset();
      board.start();
      vsBot = false;
      updateStatus();
    }

    // Globale Liste + Freunde Einladen
    function renderGlobalList() {
      const listElement = document.getElementById('global-user-list');
      listElement.innerHTML = '';

      mockGlobalUsers.forEach(user => {
        const li = document.createElement('li');
        li.className = 'user-item';
        li.innerHTML = `
          <div>
            <strong>${user.name}</strong>
            <span style="font-size:0.75rem; color:var(--text-muted); display:block;">🔥 ${user.streak} Streak</span>
          </div>
          <button class="btn btn-sm" onclick="inviteUser('${user.name}')">Einladen</button>
        `;
        listElement.appendChild(li);
      });
    }

    function inviteUser(username) {
      alert(`Einladung an ${username} wurde gesendet! (Simuliert)`);
    }

    // Beim Laden prüfen ob eingeloggt
    window.onload = checkAuth;
  </script>
</body>
</html>
