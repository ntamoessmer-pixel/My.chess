<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanChess - Profil & Schach</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: white; padding: 20px; text-align: center; }
    
    /* Profil Bereich */
    .profile-card {
      background: #1e293b; border: 1px solid #334155; padding: 15px;
      border-radius: 10px; max-width: 400px; margin: 0 auto 20px auto;
    }
    .profile-card input {
      width: 80%; padding: 8px; margin: 5px 0; background: #0f172a;
      border: 1px solid #334155; color: white; border-radius: 5px;
    }
    .btn {
      background: #38bdf8; color: black; border: none; padding: 8px 15px;
      font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 5px;
    }
    
    /* Schachbrett */
    #board {
      display: grid; grid-template-columns: repeat(8, 1fr);
      width: 100%; max-width: 360px; height: 360px; margin: 0 auto;
      border: 3px solid #334155; border-radius: 5px; overflow: hidden;
    }
    .sq {
      display: flex; align-items: center; justify-content: center;
      font-size: 25px; cursor: pointer; user-select: none;
    }
    .light { background-color: #e2e8f0; color: black; }
    .dark { background-color: #475569; color: white; }
    .selected { background-color: #f59e0b !important; }

    /* Spielliste */
    .friends { margin-top: 20px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- PROFIL & REGISTRIERUNG -->
  <div class="profile-card" id="auth-box">
    <h3>Profil erstellen</h3>
    <input type="text" id="uname" placeholder="Benutzername"><br>
    <input type="email" id="uemail" placeholder="E-Mail"><br>
    <input type="password" id="upass" placeholder="Passwort"><br>
    <button class="btn" onclick="saveProfile()">Speichern & Spielen</button>
  </div>

  <div class="profile-card" id="user-box" style="display:none;">
    <h3>👤 Profil: <span id="p-name"></span></h3>
    <p>🔥 Streak: <span id="p-streak">1</span> Tag(e)</p>
    <button class="btn" onclick="logout()" style="background:#ef4444; color:white;">Abmelden</button>
  </div>

  <!-- SCHACHBRETT -->
  <h2>CleanChess</h2>
  <p id="status" style="margin: 10px 0; color: #38bdf8;">Weiß ist am Zug</p>
  
  <div id="board"></div>

  <br>
  <button class="btn" onclick="initGame()">🔄 Spiel Neu Starten</button>

  <div class="friends">
    <p><strong>Freunde online:</strong> MasterChess (🔥 5 Tage), Player123 (🔥 2 Tage)</p>
  </div>

  <script>
    // Profil Logik
    function saveProfile() {
      const name = document.getElementById('uname').value;
      if (!name) return alert('Bitte Namen eingeben!');
      localStorage.setItem('chess_user', name);
      showProfile(name);
    }

    function showProfile(name) {
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('user-box').style.display = 'block';
      document.getElementById('p-name').innerText = name;
    }

    function logout() {
      localStorage.removeItem('chess_user');
      location.reload();
    }

    const savedUser = localStorage.getItem('chess_user');
    if (savedUser) showProfile(savedUser);

    // Schach Logik
    const startPieces = [
      ['♜','♞','♝','♛','♚','♝','♞','♜'],
      ['♟','♟','♟','♟','♟','♟','♟','♟'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['♙','♙','♙','♙','♙','♙','♙','♙'],
      ['♖','♘','♗','♕','♔','♗','♘','♖']
    ];

    let grid = [];
    let sel = null;

    function initGame() {
      grid = JSON.parse(JSON.stringify(startPieces));
      sel = null;
      document.getElementById('status').innerText = "Weiß ist am Zug";
      draw();
    }

    function draw() {
      const b = document.getElementById('board');
      b.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const d = document.createElement('div');
          d.className = `sq ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          if (sel && sel.r === r && sel.c === c) d.classList.add('selected');
          d.innerText = grid[r][c];
          d.onclick = () => clickSq(r, c);
          b.appendChild(d);
        }
      }
    }

    function clickSq(r, c) {
      if (sel) {
        // Figur bewegen
        grid[r][c] = grid[sel.r][sel.c];
        grid[sel.r][sel.c] = '';
        sel = null;
      } else {
        // Figur auswählen
        if (grid[r][c] !== '') {
          sel = { r, c };
        }
      }
      draw();
    }

    initGame();
  </script>
</body>
</html>
